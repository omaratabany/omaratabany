<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" width="900" height="160">
<defs>
  <style>
    @keyframes scan {
      0%   { transform: translateY(0px);   opacity: 0; }
      5%   { opacity: 0.5; }
      95%  { opacity: 0.12; }
      100% { transform: translateY(160px); opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { r: 3.5; opacity: 0.9; }
      50%       { r: 5.5; opacity: 0.4; }
    }
    @keyframes pulseRing {
      0%   { r: 3.5; opacity: 0.6; }
      100% { r: 11;  opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }
    @keyframes drawLine {
      from { stroke-dashoffset: 620; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes drawLineB {
      from { stroke-dashoffset: 420; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeFlat {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes bracketH {
      from { stroke-dashoffset: 34; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes bracketV {
      from { stroke-dashoffset: 26; }
      to   { stroke-dashoffset: 0; }
    }
    @keyframes nodeAppear {
      0%, 60% { opacity: 0; }
      100%    { opacity: 1; }
    }
    @keyframes lineDraw {
      0%, 50% { stroke-dashoffset: 42; }
      100%    { stroke-dashoffset: 0; }
    }
  </style>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0d0d0f"/>
    <stop offset="100%" style="stop-color:#111116"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" style="stop-color:#3b82f6"/>
    <stop offset="100%" style="stop-color:#0ea5e9"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   style="stop-color:#3b82f6;stop-opacity:0.9"/>
    <stop offset="60%"  style="stop-color:#0ea5e9;stop-opacity:0.35"/>
    <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
  </linearGradient>
  <linearGradient id="lineGradB" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   style="stop-color:#3b82f6;stop-opacity:0.5"/>
    <stop offset="50%"  style="stop-color:#0ea5e9;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
  </linearGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   style="stop-color:#3b82f6;stop-opacity:0"/>
    <stop offset="50%"  style="stop-color:#3b82f6;stop-opacity:0.06"/>
    <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
  </linearGradient>

  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0L0 0 0 40" fill="none" stroke="#fff" stroke-width="0.15" stroke-opacity="0.035"/>
  </pattern>

  <clipPath id="clip">
    <rect width="900" height="160" rx="6"/>
  </clipPath>
</defs>

<!-- Base -->
<rect width="900" height="160" fill="url(#bg)" rx="6"/>
<rect width="900" height="160" fill="url(#grid)" rx="6"/>

<!-- Scan line -->
<g clip-path="url(#clip)">
  <rect x="0" y="-32" width="900" height="32" fill="url(#scanGrad)"
        style="animation: scan 6s ease-in-out 1.2s infinite;"/>
</g>

<!-- Left accent bar -->
<rect x="0" y="0" width="3" height="160" fill="url(#accentGrad)" rx="1.5"
      style="animation: breathe 3s ease-in-out infinite;"/>

<!-- Top line draws in -->
<line x1="3" y1="0.5" x2="620" y2="0.5"
      stroke="url(#lineGrad)" stroke-width="1"
      stroke-dasharray="617" stroke-dashoffset="617"
      style="animation: drawLine 1.2s cubic-bezier(0.4,0,0.2,1) 0.3s forwards;"/>

<!-- Bottom line draws in -->
<line x1="3" y1="159.5" x2="420" y2="159.5"
      stroke="url(#lineGradB)" stroke-width="1"
      stroke-dasharray="417" stroke-dashoffset="417"
      style="animation: drawLineB 1s cubic-bezier(0.4,0,0.2,1) 0.7s forwards;"/>

<!-- Top-right corner bracket -->
<line x1="858" y1="8" x2="892" y2="8"
      stroke="#3b82f6" stroke-width="1" stroke-opacity="0.45"
      stroke-dasharray="34" stroke-dashoffset="34"
      style="animation: bracketH 0.5s ease 1.6s forwards;"/>
<line x1="892" y1="8" x2="892" y2="34"
      stroke="#3b82f6" stroke-width="1" stroke-opacity="0.45"
      stroke-dasharray="26" stroke-dashoffset="26"
      style="animation: bracketV 0.4s ease 2s forwards;"/>

<!-- Bottom-left corner bracket -->
<line x1="8" y1="152" x2="8" y2="126"
      stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"
      stroke-dasharray="26" stroke-dashoffset="26"
      style="animation: bracketV 0.4s ease 1.8s forwards;"/>
<line x1="8" y1="152" x2="34" y2="152"
      stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"
      stroke-dasharray="26" stroke-dashoffset="26"
      style="animation: bracketH 0.5s ease 2.1s forwards;"/>

<!-- Network nodes decorative -->
<circle cx="818" cy="48" r="2" fill="#3b82f6" opacity="0"
        style="animation: nodeAppear 0.5s ease 2s forwards;"/>
<circle cx="842" cy="78" r="1.5" fill="#0ea5e9" opacity="0"
        style="animation: nodeAppear 0.5s ease 2.2s forwards;"/>
<circle cx="865" cy="112" r="2" fill="#3b82f6" opacity="0"
        style="animation: nodeAppear 0.5s ease 2.4s forwards;"/>
<line x1="818" y1="48" x2="842" y2="78"
      stroke="#3b82f6" stroke-width="0.6" stroke-opacity="0.25"
      stroke-dasharray="37" stroke-dashoffset="37"
      style="animation: lineDraw 0.5s ease 2.2s forwards;"/>
<line x1="842" y1="78" x2="865" y2="112"
      stroke="#0ea5e9" stroke-width="0.6" stroke-opacity="0.2"
      stroke-dasharray="40" stroke-dashoffset="40"
      style="animation: lineDraw 0.5s ease 2.5s forwards;"/>

<!-- SYS tag -->
<text x="878" y="22" font-family="'Courier New',monospace" font-size="8"
      fill="#3b82f6" text-anchor="end" letter-spacing="2" opacity="0"
      style="animation: fadeFlat 0.5s ease 2.2s forwards;">SYS//ONLINE</text>

<!-- Name -->
<text x="36" y="76" font-family="'Courier New',monospace" font-size="38"
      font-weight="700" fill="#f1f5f9" letter-spacing="-0.5"
      filter="url(#softGlow)" opacity="0"
      style="animation: fadeIn 0.7s cubic-bezier(0.2,0,0,1) 0.5s forwards;">OMAR</text>

<!-- // divider -->
<text x="155" y="76" font-family="'Courier New',monospace" font-size="36"
      font-weight="300" fill="#3b82f6" filter="url(#glow)" opacity="0"
      style="animation: fadeIn 0.5s ease 0.85s forwards;">//</text>

<!-- Subtitle -->
<text x="198" y="76" font-family="'Courier New',monospace" font-size="21"
      font-weight="400" fill="#94a3b8" letter-spacing="0.5" opacity="0"
      style="animation: fadeIn 0.6s ease 1s forwards;">SYSTEMS &amp; FABRICATION</text>

<!-- Blinking cursor -->
<rect x="559" y="57" width="2.5" height="18" fill="#3b82f6" opacity="0"
      style="animation: fadeFlat 0s ease 1.65s forwards, blink 1s step-end 1.7s infinite;"/>

<!-- Tagline -->
<text x="37" y="108" font-family="'Courier New',monospace" font-size="10.5"
      fill="#475569" letter-spacing="3" opacity="0"
      style="animation: fadeIn 0.6s ease 1.2s forwards;">NETWORKING  ·  INFRASTRUCTURE  ·  3D PRINTING  ·  HOME LAB</text>

<!-- Separator -->
<rect x="36" y="117" width="310" height="0.5" fill="#3b82f6" opacity="0"
      style="animation: fadeFlat 0.8s ease 1.4s forwards;"/>

<!-- Pulse ring -->
<circle cx="37" cy="138" r="3.5" fill="none" stroke="#22c55e" stroke-width="1" opacity="0"
        style="animation: pulseRing 2.2s ease-out 2s infinite;"/>
<!-- Status dot -->
<circle cx="37" cy="138" r="3.5" fill="#22c55e" filter="url(#dotGlow)" opacity="0"
        style="animation: fadeFlat 0.3s ease 1.6s forwards, pulse 2.2s ease-in-out 2s infinite;"/>

<text x="47" y="142" font-family="'Courier New',monospace" font-size="9.5"
      fill="#475569" letter-spacing="1.5" opacity="0"
      style="animation: fadeFlat 0.4s ease 1.7s forwards;">ONLINE</text>

<text x="103" y="142" font-family="'Courier New',monospace" font-size="9.5"
      fill="#334155" opacity="0"
      style="animation: fadeFlat 0.4s ease 1.75s forwards;">|</text>

<text x="113" y="142" font-family="'Courier New',monospace" font-size="9.5"
      fill="#475569" letter-spacing="1.5" opacity="0"
      style="animation: fadeFlat 0.4s ease 1.8s forwards;">Dubai, UAE</text>

<text x="183" y="142" font-family="'Courier New',monospace" font-size="9.5"
      fill="#334155" opacity="0"
      style="animation: fadeFlat 0.4s ease 1.85s forwards;">|</text>

<text x="193" y="142" font-family="'Courier New',monospace" font-size="9.5"
      fill="#3b82f6" letter-spacing="1.5" opacity="0"
      style="animation: fadeFlat 0.4s ease 1.9s forwards;">iNetwork Solutions  ·  Fabricode</text>

</svg>
